<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid slice">
  <!-- Banig-inspired diagonal weave -->
  <g stroke="#4C925D" stroke-opacity="0.07" stroke-width="0.8" fill="none">
    <line x1="0" y1="0" x2="240" y2="240"/>
    <line x1="60" y1="0" x2="240" y2="180"/>
    <line x1="120" y1="0" x2="240" y2="120"/>
    <line x1="180" y1="0" x2="240" y2="60"/>
    <line x1="0" y1="60" x2="180" y2="240"/>
    <line x1="0" y1="120" x2="120" y2="240"/>
    <line x1="0" y1="180" x2="60" y2="240"/>
  </g>
  <g stroke="#B89A52" stroke-opacity="0.06" stroke-width="0.8" fill="none">
    <line x1="240" y1="0" x2="0" y2="240"/>
    <line x1="180" y1="0" x2="0" y2="180"/>
    <line x1="120" y1="0" x2="0" y2="120"/>
    <line x1="60" y1="0" x2="0" y2="60"/>
    <line x1="240" y1="60" x2="60" y2="240"/>
    <line x1="240" y1="120" x2="120" y2="240"/>
    <line x1="240" y1="180" x2="180" y2="240"/>
  </g>
  <!-- Philippine sun rays (subtle) -->
  <g stroke="#B89A52" stroke-opacity="0.05" stroke-width="0.6" fill="none" transform="translate(120,120)">
    <line x1="0" y1="0" x2="0" y2="-90"/>
    <line x1="0" y1="0" x2="64" y2="-64"/>
    <line x1="0" y1="0" x2="90" y2="0"/>
    <line x1="0" y1="0" x2="64" y2="64"/>
    <line x1="0" y1="0" x2="0" y2="90"/>
    <line x1="0" y1="0" x2="-64" y2="64"/>
    <line x1="0" y1="0" x2="-90" y2="0"/>
    <line x1="0" y1="0" x2="-64" y2="-64"/>
  </g>
  <!-- Sun core -->
  <circle cx="120" cy="120" r="6" fill="#B89A52" fill-opacity="0.06"/>
  <!-- Archipelago-inspired dots -->
  <g fill="#4C925D" fill-opacity="0.09">
    <circle cx="30" cy="30" r="1.6"/>
    <circle cx="34" cy="36" r="1.2"/>
    <circle cx="26" cy="38" r="1"/>
    <circle cx="200" cy="200" r="1.6"/>
    <circle cx="206" cy="196" r="1.2"/>
    <circle cx="196" cy="206" r="1"/>
    <circle cx="190" cy="50" r="1.4"/>
    <circle cx="50" cy="190" r="1.4"/>
  </g>
  <!-- subtle neutral grid dots -->
  <g fill="#202020" fill-opacity="0.03">
    <circle cx="120" cy="30" r="0.8"/>
    <circle cx="120" cy="210" r="0.8"/>
    <circle cx="30" cy="120" r="0.8"/>
    <circle cx="210" cy="120" r="0.8"/>
  </g>
</svg>