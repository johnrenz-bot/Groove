services:
  groove-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groovesystem-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env.local
        required: false
